version: '3.8'

services:
  music-bot:
    build: .
    container_name: discord-music-bot
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - ./playlists:/app/playlists
      - ./temp_audio:/app/temp_audio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
